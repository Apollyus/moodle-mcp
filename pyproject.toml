[project]
name = "moodle-mcp"
version = "0.3.0"
description = "A Model Context Protocol (MCP) server implementation that provides capabilities to interact with Moodle LMS."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "glom>=24.11.0",
    "mcp[cli]>=2.3.0,<3",
    "fonttools>=4.50",
    "pypdf>=5.0",
    "python-dotenv>=1.1.0",
    "requests>=2.32.3",
]

[project.optional-dependencies]
login = ["playwright>=1.40"]

[project.scripts]
moodle-mcp = "moodle_mcp.server:main"
moodle-mcp-login = "moodle_mcp.server:login_main"

[project.urls]
Homepage = "https://github.com/loyaniu/moodle-mcp"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
